# Every push and pull request runs type check, unit tests and E2E in real browsers (Chromium and WebKit, 3 devices).
# Pushes to main also deploy, once the repository variable DEPLOY_ENABLED is "true" (set it after setup-cloudflare).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Without them the E2E answers come from the mock model
# and the tests tagged @real-ai are skipped; with them the real Workers AI model is called.
name: テストとデプロイ

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:e2e --reporter=list,github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, then production D1 migrations, then wrangler deploy.
      - name: pnpm run deploy
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee out.log || { echo "::error title=pnpm run deploy に失敗::$(tail -40 out.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - run: pnpm exec playwright install --with-deps chromium
      - name: 本番の確認（開いてすぐ相談できる・ホーム画面への追加）
        run: |
          URL=$(node -e "const w=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(w.match(/\"CANONICAL_ORIGIN\": \"(https:[^\"]+)\"/)[1])")
          BASE_URL=$URL pnpm exec playwright test --project=desktop-chrome --project=mobile-chrome
