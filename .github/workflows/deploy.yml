# Every push and pull request runs type check, unit tests and E2E in real browsers (Chromium and WebKit, 3 devices).
# Pushes to main also deploy, once the repository variable DEPLOY_ENABLED is "true" (set it after setup-cloudflare).
# E2E answers come from the mock model and the tests tagged @real-ai are skipped. Production deploys run on Cloudflare Workers Builds.
# The repository secret CLOUDFLARE_API_TOKEN is the D1 read-only token for usage-report.yml; do not pass it here
# (with it the dev server tries remote Workers AI bindings and fails to start).
name: テストとデプロイ

on:
  push:
    branches: [main]
  pull_request:
    # labeled：PR に「e2e」ラベルを付けたときに E2E を動かすため
    types: [opened, synchronize, reopened, labeled]
    # 文書だけの変更ではテストを動かさない（2026-11-19。Actions の無料枠を超えて止まったため）
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions の費用を無料枠（月2,000分）に収めるため、E2E は次のときだけ GitHub で動かす（2026-11-19 丸岡「極限までコスト削減」）。
# - 手動の実行（workflow_dispatch）
# - PR に「e2e」ラベルが付いているとき
# - main への push で、Actions からデプロイする設定（DEPLOY_ENABLED）のとき
# それ以外の PR では型チェックと単体テストだけを動かす。E2E（Chromium と WebKit）は PR の前に手元で通す（CLAUDE.md の「確認」）
env:
  RUN_E2E: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e') || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') }}

jobs:
  test:
    # main への push では動かさない（2026-11-19）。main へは PR 経由でしか入らず、PR で同じテストを済ませている。
    # 本番は Cloudflare Workers Builds がデプロイし、下の deploy は DEPLOY_ENABLED が "true" のときだけ。そのときは push でもテストする
    if: (github.event_name != 'push' || vars.DEPLOY_ENABLED == 'true') && (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository token is scoped for the usage report (D1 read). Pass it to the E2E only when the
    # variable E2E_REAL_AI is "true"; otherwise the tests run against the mock model.
    env:
      CLOUDFLARE_API_TOKEN: ${{ vars.E2E_REAL_AI == 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - if: env.RUN_E2E == 'true'
        run: pnpm exec playwright install --with-deps chromium
      # WebKit（iPhone 15）は下の test-webkit で macOS の上で回す
      - if: env.RUN_E2E == 'true'
        run: pnpm run test:e2e --reporter=list,github --project=mobile-chrome --project=desktop-chrome
      - uses: actions/upload-artifact@v7
        if: failure() && env.RUN_E2E == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # iPhone 15（WebKit）の E2E。Linux の WebKit は GPU なしで描画し、ガラスの面（backdrop-filter）が十数枚あると
  # 1フレームに1〜2秒、層の作り直しに十数秒〜数分かかって時間切れになった（plan 20261112-webkit-e2e-stability）。
  # macOS の WebKit は Safari と同じ Core Animation で描画し、同じ操作が数秒で終わる
  test-webkit:
    # iPhone 15（WebKit）は macOS で動き、10倍で数えられる。RUN_E2E と同じ条件のときだけ動かす（上の env の説明）
    if: (github.event.action != 'labeled' || github.event.label.name == 'e2e') && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e') || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ vars.E2E_REAL_AI == 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm run test:e2e --reporter=list,github --project=mobile-safari
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-webkit
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [test, test-webkit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, then production D1 migrations, then wrangler deploy.
      - name: pnpm run deploy
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee out.log || { echo "::error title=pnpm run deploy に失敗::$(tail -40 out.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - run: pnpm exec playwright install --with-deps chromium
      - name: 本番の確認（開いてすぐ相談できる・ホーム画面への追加）
        run: |
          URL=$(node -e "const w=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(w.match(/\"CANONICAL_ORIGIN\": \"(https:[^\"]+)\"/)[1])")
          BASE_URL=$URL pnpm exec playwright test --project=desktop-chrome --project=mobile-chrome
